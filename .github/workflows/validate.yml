name: validate

on:
  pull_request:
  push:
    branches: [main]
  # Weekly sweep for dead tool URLs. Link rot happens on a timescale of months,
  # so it is a periodic health check, not a per-commit gate.
  schedule:
    - cron: "0 6 * * 1"
  # Lets a maintainer re-run validation from the Actions tab without pushing a
  # commit - useful after a GitHub Actions incident, when queued runs are lost.
  workflow_dispatch:

# This workflow only reads the checkout; it never writes to the repository.
permissions:
  contents: read

# A newer push to a pull request supersedes its in-flight run. Runs on main are
# never cancelled - they are the validation record for the branch's history.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  index-and-frontmatter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate frontmatter, INDEX.md freshness and internal links
        run: python3 scripts/build-index.py --check

  link-check:
    # Deliberately not run on pull requests. It cannot gate a merge (nothing in
    # a diff changes whether shodan.io is up), and firing ~90 requests at
    # third-party OSINT services from shared runner IPs on every PR erodes the
    # goodwill the check depends on - several already answer 403 to any
    # scripted client. Weekly, or on demand, is the right cadence.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Worst case is 90 URLs x 16s (HEAD then GET fallback, 8s each) plus the
    # inter-request delay, so about 25 minutes. Bounded well under the default
    # six hours so a hung request cannot squat on a runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Exits non-zero only on genuinely dead URLs (404/410/DNS). Sites that
      # merely refuse an automated client are reported as BLOCKED and ignored,
      # so a failure here is a real finding worth acting on.
      - name: Check tool URLs
        run: python3 scripts/check-links.py --timeout 8 --delay 0.3
